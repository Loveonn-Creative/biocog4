const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

  in2: x => x * x, in3: x => x * x * x,

const PW = 560, PH = 840, PD = 46;
function zigzag(w, h, tooth = 14, amp = 6) {
  const pts = [];
  for (let x = 0; x <= w; x += tooth) pts.push(`${x}px ${(x / tooth) % 2 ? amp : 0}px`);
  pts.push(`${w}px 0px`, `${w}px ${h}px`);
  for (let x = w; x >= 0; x -= tooth) pts.push(`${x}px ${h - ((x / tooth) % 2 ? amp : 0)}px`);
  pts.push(`0px ${h}px`);

function build(el, front, back, side, foil) {
  el.style.width = PW + 'px'; el.style.height = PH + 'px';
  const faces = [];

    faces.push({ n, sh: f.querySelector('.sh'), sn: f.querySelector('.sn'), cr: f.querySelector('.cr'), el: f });

  const seals = '<div class="seal t"></div><div class="seal b"></div>';
  const fF = mk(front + seals, PW, PH, `translateZ(${PD / 2}px)`, [0, 0, 1]);

  const sideH = PH - 84;
  mk(`<div style="position:absolute;inset:0;background:${side}"></div>`, PD, sideH, `rotateY(-90deg) translateZ(${PW / 2}px)`, [-1, 0, 0]);

// CSS rotations: x right, y down, z toward viewer. transform = Rx * Ry * Rz.

const HALF = (() => { const v = [LIGHT[0], LIGHT[1], LIGHT[2] + 1], m = Math.hypot(...v); return v.map(c => c / m); })();

  el.style.transform = `translateZ(${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s * (1 + squash)}, ${s * (1 - squash)})`;
