  MYTH KA POSTMORTEM #01 — "CBAM sirf badi companies ke liye." (31 s, 1080x1920, deterministic window.render(t))
  FACTS (verified 19 Oct 2026; network fetch to EUR-Lex was blocked, confirmed via EU-domain pages in search):
  1) Goods in scope = Annex I of Regulation (EU) 2023/956: cement, iron and steel, aluminium, fertilisers,
     electricity and hydrogen (incl. some precursors/downstream products), identified by CN code. Obligation sits with
     the importer / authorised CBAM declarant and is based on embedded emissions of the goods. No provision keys
     scope to the size of the third-country producer or exporter.
     - EU Commission, CBAM page: https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism_en
     - EU Commission, CBAM definitive regime: https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/cbam-definitive-regime_en
     - Guidance doc for installation operators outside the EU (Annex I goods, CN codes):
       https://taxation-customs.ec.europa.eu/system/files/2023-12/Guidance%20document%20on%20CBAM%20implementation%20for%20installation%20operators%20outside%20the%20EU.pdf
  2) Regulation (EU) 2025/2083 (CBAM simplification, published OJ Oct 2025) replaces the EUR 150/consignment exemption
     with a single mass-based threshold: 50 tonnes net mass, cumulative PER IMPORTER PER CALENDAR YEAR, for iron & steel,
     aluminium, fertilisers and cement (not electricity or hydrogen). Importers at or under it are exempt; once exceeded,
     obligations apply to the importer's imports that year. ~90% of importers exempt, ~99% of embedded emissions stay in scope.
     - EU Commission news "Officially published: Simplifications for the CBAM" (20 Oct 2025):
       https://taxation-customs.ec.europa.eu/news/officially-published-simplifications-carbon-border-adjustment-mechanism-cbam-2025-10-20_en
     - Council press release 29 Sep 2025: https://www.consilium.europa.eu/en/press/press-releases/2025/09/29/cbam-council-signs-off-simplification-to-the-eu-carbon-leakage-instrument/
     - Council/Parliament deal 18 Jun 2025: https://www.consilium.europa.eu/en/press/press-releases/2025/06/18/carbon-border-adjustment-mechanism-cbam-council-and-parliament-strike-a-deal-on-its-simplification/
  Wording kept deliberately safe: we do NOT say the supplier pays; we say the 50 t exemption is the importer's yearly total,
  so a small supplier's goods sold to an importer above 50 t are "in scope".
  Group, members, times are fictional. Chat UI is a generic hand-drawn chat, no third-party branding.
-->

<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const back = x => { const c = 1.7; return 1 + (c + 1)*Math.pow(x - 1, 3) + c*Math.pow(x - 1, 2); };
const bounce = x => { const n = 7.5625, d = 2.75; if (x < 1/d) return n*x*x; if (x < 2/d) return n*(x -= 1.5/d)*x + .75; if (x < 2.5/d) return n*(x -= 2.25/d)*x + .9375; return n*(x -= 2.625/d)*x + .984375; };
const lerp = (a, b, k) => a + (b - a)*k;
const draw = (el, p) => { el.style.strokeDasharray = '1 1'; el.style.strokeDashoffset = 1 - cl(p); };

// word-rise helper
function words(el, html) { el.innerHTML = html.split(' ').map(w => `<span class="w">${w} </span>`).join(''); return [...el.children]; }
function rise(ws, t, t0, step = .12, out = 1e9) {
  const vo = 1 - seg(t, out, out + .3);
  ws.forEach((w, i) => { const k = eo(seg(t, t0 + i*step, t0 + i*step + .4));
    w.style.opacity = k*vo; w.style.transform = `translateY(${(1 - k)*60 - (1 - vo)*40}px)`; });
}
const T1 = words($('t1'), 'CBAM company ka size nahi dekhta.'); T1[3].id = 'sz'; T1[3].innerHTML = '<b style="font-weight:700">size</b> '; 
const T2 = words($('t2'), 'Maal ka carbon dekhta hai.');
const T3a = words($('t3a'), '50 tonne ki chhoot?'); T3a[0].classList.add('mono'); T3a[0].style.color = 'var(--ink)';
const T3b = words($('t3b'), 'Importer ka saal&nbsp;bhar ka total.');
const P1 = words($('p1'), 'Company chhoti ho sakti hai.');
const P2 = words($('p2'), 'Rule nahi.');

// goods layout
const G = [[220, 1024], [505, 1024], [790, 1024], [220, 1354], [505, 1354], [790, 1354]];
G.forEach(([x, y], i) => { const l = $('l' + i); l.style.left = x + 'px'; l.style.top = (y + 40) + 'px'; });
$('rollers').innerHTML = [1030, 1360].map(y => [0,1,2,3,4,5,6,7].map(k => `<circle class="rol" cx="${110 + k*110}" cy="${y + 22}" r="13" pathLength="1"/>`).join('')).join('');

// crates: [x, restY, w, h, me]
const C = [[148, 1300, 140, 84], [295, 1300, 140, 84], [442, 1300, 130, 84], [160, 1210, 130, 84], [298, 1210, 150, 84],
           [455, 1210, 110, 84], [200, 1120, 150, 84], [362, 1148, 66, 56, true], [438, 1120, 130, 84]];
$('crates').innerHTML = C.map((c, i) => `<div class="crate${c[4] ? ' me' : ''}" id="c${i}" style="left:${c[0]}px;width:${c[2]}px;height:${c[3]}px"></div>`).join('');

// arrows flying out of the forward
$('arrows').innerHTML = Array.from({length: 9}, (_, i) => `<path id="a${i}" d="M0 -12 L16 0 L0 12 M16 0 C4 -2 -10 2 -20 12" fill="none" stroke="#a6abb6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
// pop fragments + flying words
const FR = Array.from({length: 12}, (_, i) => { const a = i/12*Math.PI*2 + .3; return { a, v: 900 + (i*137 % 5)*160, r: (i*71 % 7 - 3)*120, w: 60 + (i*53 % 4)*30, h: 40 + (i*29 % 3)*26 }; });
$('frags').innerHTML = FR.map((f, i) => `<div class="frag" id="f${i}" style="width:${f.w}px;height:${f.h}px;border-radius:${10 + i % 3 * 8}px ${4 + i % 2 * 20}px"></div>`).join('') +
  'CBAM sirf badi companies ke liye.'.split(' ').map((w, i) => `<div class="fword" id="fw${i}">${w}</div>`).join('');
$('burst').innerHTML = Array.from({length: 14}, (_, i) => `<path id="b${i}" pathLength="1" fill="none" stroke="#f4ede1" stroke-width="${6 + i % 3*3}" stroke-linecap="round"/>`).join('');

const POP = 6.3, PX = 505, PY = 900;
const DUR = 31;

function bubbleArrive(el, dt) {   // pop-in of an incoming message
  const k = back(seg(dt, 0, .45)); el.style.opacity = cl(dt/.12);
  return { s: lerp(.6, 1, k), y: (1 - eo(seg(dt, 0, .45)))*90 };
}

window.render = function (t) {
  // ---------------- CHAT ----------------
  const loop = t > 29.4;
  const chatIn = loop ? 1 - eio(seg(t, 29.5, 30.2)) : 0;   // chat sliding back up (1 = below screen)
  const chat = $('chat'), bub = $('bub'), knot = $('knot');
  chat.style.display = (t < POP + .9 || loop) ? 'block' : 'none';
  chat.style.transform = `translateY(${chatIn*1920}px)`;
  chat.style.clipPath = (!loop && t > POP + .1) ? `circle(${Math.max(0, 1500 - eio(seg(t, POP + .12, POP + .85))*1500)}px at ${PX}px ${PY}px)` : 'none';
  // reverse: we want the paper to grow FROM the pop point, so clip the chat as a ring: use inverse via paper on top instead
  chat.style.clipPath = 'none';

  if (!loop) {
    const a = bubbleArrive(bub, t + .25);
    // inflation 1.4 → POP: bubble grows into a balloon, drifts to centre, wobbles
    const inf = eio(seg(t, 1.4, 6.1));
    const s = a.s*(1 + .15*inf + .03*Math.sin(t*7)*inf);
    const cx = lerp(0, 505 - 350 - 80, inf);  // move from left-aligned to centred
    const rot = Math.sin(t*2.3)*3*inf;
    const rad = lerp(30, 340, inf);
    bub.style.borderRadius = `${rad}px ${rad}px ${rad}px ${rad}px / ${rad*1.05}px ${rad*1.05}px ${rad*1.2}px ${rad*1.2}px`;
    bub.style.width = '700px';
    bub.style.padding = `${lerp(26, 130, inf)}px ${lerp(34, 90, inf)}px ${lerp(22, 150, inf)}px`;
    bub.style.left = (80 + cx) + 'px';
    bub.style.top = (760 - inf*90) + 'px';
    bub.style.transform = `translateY(${a.y}px) rotate(${rot}deg) scale(${s})`;
    bub.style.background = `rgb(${lerp(42, 58, inf)},${lerp(46, 63, inf)},${lerp(55, 76, inf)})`;
    bub.style.setProperty('--x', 0);
    bub.style.boxShadow = `0 ${30*inf}px ${60*inf}px -20px rgba(0,0,0,.7)`;
    $('shine').style.opacity = inf;
    bub.style.textAlign = inf > .5 ? 'center' : 'left';
    $('tm').style.opacity = 1 - seg(t, 1.6, 2.2);
    const steps = [[1.6, '×2'], [2.3, '×17'], [3.0, '×248'], [3.7, '×1,024'], [4.4, '×9,999+']];
    let c = ''; steps.forEach(([at, v]) => { if (t >= at) c = v; }); $('cnt').textContent = c;
    // knot + string under the balloon
    const r = bub.getBoundingClientRect();
    knot.style.opacity = seg(inf, .35, .6);
    knot.style.transform = `translate(${r.left + r.width/2 - 40}px, ${r.bottom - 6}px) rotate(${rot*.6}deg)`;
    draw($('string'), seg(inf, .4, 1));
    bub.style.display = t < POP ? 'block' : 'none'; knot.style.display = t < POP ? 'block' : 'none';
    // forward arrows streaming off to the right with each forward
    for (let i = 0; i < 9; i++) { const at = 1.6 + i*.5, k = seg(t, at, at + .9), el = $('a' + i);
      el.style.opacity = k > 0 && k < 1 ? Math.sin(k*Math.PI) : 0;
      el.setAttribute('transform', `translate(${lerp(760, 1140, eo(k))}, ${lerp(700 + (i % 3)*90, 560 + (i % 4)*120, k)}) rotate(${-12 + (i % 3)*10})`); }
    $('tm').textContent = '4:58 AM';
    $('mtx').style.fontSize = '68px';
  } else {
    // a new forward arrives (loop) — same state as frame 0 when t hits 31
    const LA = DUR - .25; bub.style.display = t > LA ? 'block' : 'none';
    const aa = bubbleArrive(bub, t - LA);
    bub.style.borderRadius = '30px'; bub.style.width = '700px'; bub.style.padding = '26px 34px 22px'; bub.style.left = '80px'; bub.style.top = '760px';
    bub.style.background = 'rgb(42,46,55)'; bub.style.boxShadow = 'none'; bub.style.textAlign = 'left';
    bub.style.transform = `translateY(${aa.y}px) scale(${aa.s})`;
    $('shine').style.opacity = 0; $('tm').style.opacity = 1; $('tm').textContent = '4:59 AM'; $('cnt').textContent = '';
    knot.style.display = 'none';
    for (let i = 0; i < 9; i++) $('a' + i).style.opacity = 0;
  }

  // ---------------- PIN + POP ----------------
  const pin = $('pinG');
  const pk = seg(t, 5.55, POP);   // flies in from upper right
  const tipX = lerp(1250, PX + 300, eio(pk)), tipY = lerp(380, PY - 120, eio(pk));
  const pinOut = seg(t, POP + .15, POP + .9);
  pin.style.opacity = (t > 5.5 && t < POP + .9 && !loop) ? 1 - pinOut : 0;
  pin.setAttribute('transform', `translate(${tipX + pinOut*120}, ${tipY - pinOut*200}) rotate(${-32 - pinOut*20})`);

  const pp = t - POP;
  for (let i = 0; i < 12; i++) { const f = FR[i], el = $('f' + i), k = cl(pp/1.4);
    el.style.display = (pp > 0 && pp < 1.4 && !loop) ? 'block' : 'none';
    const x = PX + Math.cos(f.a)*f.v*k*.7, y = PY + Math.sin(f.a)*f.v*k*.55 + 1400*k*k;
    el.style.transform = `translate(${x - f.w/2}px, ${y}px) rotate(${f.r*k}deg) scale(${1 - k*.4})`; el.style.opacity = 1 - k; }
  for (let i = 0; i < 6; i++) { const el = $('fw' + i), k = cl(pp/1.6);
    el.style.display = (pp > 0 && pp < 1.6 && !loop) ? 'block' : 'none';
    const sx = 200 + (i % 3)*240, sy = 800 + Math.floor(i/3)*90;
    const vx = (i % 3 - 1)*320 + (i % 2 ? 80 : -60), vy = -500 - (i*97 % 3)*120;
    el.style.transform = `translate(${sx + vx*k}px, ${sy + vy*k + 2200*k*k}px) rotate(${(i % 2 ? 1 : -1)*200*k}deg)`; el.style.opacity = 1 - seg(k, .6, 1); }
  for (let i = 0; i < 14; i++) { const a = i/14*Math.PI*2, r0 = 260 + (i % 3)*40, r1 = r0 + 140 + (i % 2)*80, el = $('b' + i);
    el.setAttribute('d', `M${PX + Math.cos(a)*r0} ${PY + Math.sin(a)*r0} L${PX + Math.cos(a)*r1} ${PY + Math.sin(a)*r1}`);
    const k = seg(pp, 0, .25), o = 1 - seg(pp, .25, .55); draw(el, k); el.style.opacity = pp > 0 && !loop ? o : 0; }

  // ---------------- PAPER (revealed as a circle from the pop) ----------------
  const paper = $('paper');
  const rev = eio(seg(t, POP + .05, POP + .75));
  paper.style.zIndex = loop ? 0 : 2;
  $('chat').style.zIndex = loop ? 3 : 1;
  $('pin').style.zIndex = 4;
  if (!loop) { paper.style.display = t > POP ? 'block' : 'none'; paper.style.clipPath = `circle(${rev*2300}px at ${PX}px ${PY}px)`; }
  else { paper.style.display = 'block'; paper.style.clipPath = 'none'; }
  // burst lines over paper too
  $('burst').style.zIndex = 5;

  // tag
  const tagK = seg(t, 6.9, 7.5), tagOut = seg(t, 25.9, 26.3);
  $('tag').style.opacity = cl(tagK*3)*(1 - tagOut);
  draw($('tagbox'), tagK);

  // T1  7.2 – 10.2
  rise(T1, t, 7.2, .14, 10.1);
  const sz = $('sz').firstChild.getBoundingClientRect();
  $('strikeP').setAttribute('d', `M${sz.left - 10} ${sz.top + sz.height*.56} C${sz.left + sz.width*.4} ${sz.top + sz.height*.5} ${sz.left + sz.width*.7} ${sz.top + sz.height*.6} ${sz.right + 14} ${sz.top + sz.height*.5}`);
  draw($('strikeP'), seg(t, 8.6, 9.0)); $('strikeP').style.opacity = 1 - seg(t, 10.1, 10.4);

  // T2  10.4 – 15.0 : goods arrive on belts
  rise(T2, t, 10.4, .12, 14.8);
  const gOut = seg(t, 14.8, 15.1);
  $('goods').style.opacity = 1 - gOut;
  $('goods').style.display = t > 10 && t < 15.2 ? 'block' : 'none';
  draw($('belt1'), seg(t, 10.6, 11.2)); draw($('belt2'), seg(t, 10.8, 11.4));
  document.querySelectorAll('.rol').forEach((r, i) => draw(r, seg(t, 10.9 + (i % 8)*.04, 11.3 + (i % 8)*.04)));
  for (let i = 0; i < 6; i++) { const at = 11.3 + i*.42, k = seg(t, at, at + .7), g = $('g' + i);
    const [x, y] = G[i]; const sl = (1 - eo(k))*-260;
    g.setAttribute('transform', `translate(${x + sl}, ${y - 4})`);
    g.querySelectorAll('path,circle').forEach(p => { p.setAttribute('pathLength', 1); draw(p, seg(k, 0, .9)); });
    const l = $('l' + i); l.style.opacity = seg(t, at + .45, at + .75); l.style.transform = `translateX(-50%) translateY(${(1 - seg(t, at + .45, at + .75))*20}px) rotate(${(i % 2 ? 2 : -2)}deg)`; }

  // T3  15.1 – 22.0
  const showT3 = t > 15 && t < 22.4;
  $('binwrap').style.display = showT3 ? 'block' : 'none';
  rise(T3a, t, 15.2, .12, 16.9);
  $('fifty').style.display = 'none'; T3a[0].textContent = String(Math.round(eo(seg(t, 15.2, 16.0))*50)).padStart(2, '0') + ' ';
  rise(T3b, t, 17.2, .12, 22.0);
  $('binwrap').style.opacity = 1 - seg(t, 21.9, 22.3);
  draw($('bin'), seg(t, 15.4, 16.1)); draw($('gauge'), seg(t, 15.6, 16.2)); draw($('line50'), seg(t, 16.0, 16.4));
  $('binl').style.opacity = seg(t, 16.1, 16.5); $('g50').style.opacity = seg(t, 16.2, 16.6);
  let landed = 0;
  C.forEach((c, i) => { const at = 17.3 + i*.36, k = seg(t, at, at + .55), el = $('c' + i);
    const y = lerp(560, c[1], bounce(k)); el.style.top = y + 'px'; el.style.opacity = k > 0 ? 1 : 0;
    el.style.transform = `rotate(${(1 - k)*(i % 2 ? 8 : -8)}deg)`; if (k >= .55) landed++; });
  const level = cl(landed/9*1.12 + .0);
  const fillH = eo(cl(landed/9))*600 + seg(t, 21, 21.6)*0; // 9 crates → past the 50 t line
  const gf = $('gfill'); gf.setAttribute('height', fillH); gf.setAttribute('y', 1380 - fillH);
  const crossed = fillH > 400;
  gf.style.fill = crossed ? '#e9b9a5' : '#d4c8b3';
  $('line50').style.stroke = crossed ? 'var(--red)' : 'var(--ink)';
  // the saffron "aap" crate gets a hand arrow
  const me = C[7], meK = seg(t, 20.0, 20.5);
  $('mearrow').setAttribute('d', `M${me[0] - 90} ${me[1] - 92} C${me[0] - 50} ${me[1] - 90} ${me[0] - 10} ${me[1] - 60} ${me[0] + 8} ${me[1] - 10} M${me[0] + 8} ${me[1] - 10} L${me[0] - 22} ${me[1] - 32} M${me[0] + 8} ${me[1] - 10} L${me[0] + 18} ${me[1] - 46}`);
  draw($('mearrow'), meK); $('mearrow').style.stroke = '#c96612';
  const mel = $('mel'); mel.style.left = (me[0] - 140) + 'px'; mel.style.top = (me[1] - 175) + 'px'; mel.style.opacity = seg(t, 20.3, 20.6);
  const st = seg(t, 20.9, 21.15), sc = $('scope');
  sc.style.opacity = st > 0 ? 1 : 0; sc.style.transform = `rotate(-9deg) scale(${lerp(1.8, 1, eo(st))})`;
  sc.style.left = '96px'; sc.style.top = '760px';

  // payoff 22.4 – 26.2
  rise(P1, t, 22.5, .14, 26.1);
  rise(P2, t, 23.9, .22, 26.1);
  draw($('pu'), seg(t, 24.6, 25.1)); $('pu').style.opacity = 1 - seg(t, 26.1, 26.4);
  const cr = seg(t, 22.9, 23.4);
  $('pcr').setAttribute('transform', `translate(700, ${lerp(480, 632, bounce(cr))})`);
  $('pcr').style.opacity = (cr > 0 ? 1 : 0)*(1 - seg(t, 26.1, 26.4));

  // sign-off 26.4 – 29.5
  const so = (el, a) => { const k = eo(seg(t, a, a + .5)); el.style.opacity = k*(1 - seg(t, 29.2, 29.5)); el.style.transform = `translateY(${(1 - k)*40}px)`; };
  so($('wm'), 26.4); so($('sl1'), 27.0); so($('sl2'), 27.7);
  draw($('fwa'), seg(t, 28.2, 28.7)); $('fwa').style.opacity = 1 - seg(t, 29.2, 29.5);

  // reduced motion is not applicable to a rendered video; final states hold still.
};
window.render(0);
</script>
