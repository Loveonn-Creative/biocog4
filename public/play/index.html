<!--
  Chai Break Arcade. One self-contained file: no libraries, no fonts to fetch,
  no AI, no uploads, nothing sent anywhere. The service worker (/sw.js) keeps
  this file so it also opens when the visitor has no internet.
  Facts used in the copy (kept here, not on screen):
  - India grid: 0.710 kg CO2 per kWh (supabase/functions/_shared/emissionFactors.ts).
  - Each 1 C higher on an AC saves about 6% electricity (Bureau of Energy
    Efficiency / Ministry of Power advisory, June 2018).
  - ENERGY STAR LEDs use at least 75% less energy than incandescent bulbs (US DOE,
    energy.gov "LED Lighting"); the copy says "about 75%" and compares with filament bulbs only.
  - Compressed-air leaks can waste 20-30% of a compressor's output (US DOE,
    "Improving Compressed Air System Performance" sourcebook).
-->
<style>
:root{
  --paper:#f3e9d8;--paper2:#eadcc4;--ink:#2a2018;--ink2:#5b4b3c;--masala:#d9572a;--haldi:#e9a92a;
  --leaf:#2f7a4c;--sky:#9fd0e2;--smog:#8b857a;--card:#fffaf0;--line:#2a2018;--shadow:rgba(42,32,24,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#1d1914;--paper2:#2a241c;--ink:#f3e9d8;--ink2:#c9b9a2;--masala:#f07a4a;--haldi:#f2bd4a;
  --leaf:#5bb27c;--sky:#2c5566;--smog:#4d4840;--card:#27211a;--line:#f3e9d8;--shadow:rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:16px/1.45 ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Devanagari",sans-serif;
  min-height:100svh;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));
  background-image:radial-gradient(var(--paper2) 1px,transparent 1.2px);background-size:22px 22px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding-block:16px 40px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.02em;text-decoration:none;color:var(--ink);margin-right:auto;display:flex;align-items:center;gap:8px}
.pill{border:2px solid var(--line);border-radius:999px;background:var(--card);padding:6px 12px;font-size:14px;font-weight:700}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.langs{display:flex;gap:4px}
@media (max-width:440px){.pill{padding:5px 9px;font-size:13px}.brand span{display:none}}
.sticker{display:inline-block;transform:rotate(-3deg);background:var(--haldi);color:#2a2018;border:2.5px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:800;font-size:.9rem;box-shadow:3px 3px 0 var(--shadow);margin-top:14px}
.steam path{animation:rise 2.6s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.8s}
@keyframes rise{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
.offline{display:none;margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-weight:600}
body.is-offline .offline{display:block}
h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.02;margin:22px 0 8px;letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal;color:var(--masala)}
.lede{color:var(--ink2);max-width:34ch;margin:0 0 20px;font-size:1.05rem}
.shelf{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.ticket{position:relative;text-align:left;border:2.5px solid var(--line);border-radius:18px;background:var(--card);padding:14px 14px 16px;
  box-shadow:5px 6px 0 var(--shadow);transition:transform .15s ease,box-shadow .15s ease;min-width:0}
.ticket:hover,.ticket:focus-visible{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:8px 10px 0 var(--shadow);outline:none}
.ticket:nth-child(2):hover{transform:translate(-2px,-3px) rotate(.6deg)}
.ticket svg{width:100%;height:auto;display:block;margin-bottom:8px}
.ticket b{display:block;font-size:1.3rem;letter-spacing:-.01em}
.ticket span{display:block;color:var(--ink2);font-size:.95rem}
.ticket .best{margin-top:8px;font-size:.8rem;font-weight:700;color:var(--masala);letter-spacing:.04em;text-transform:uppercase}
.stage{display:none}
body[data-view="runner"] #runner,body[data-view="swipe"] #swipe,body[data-view="grid"] #grid{display:block}
body:not([data-view="home"]) #home{display:none}
.bar{display:flex;align-items:center;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.bar h2{margin:0 auto 0 0;font-size:1.5rem;letter-spacing:-.01em}
.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:700}
.hud{font-weight:800;font-variant-numeric:tabular-nums}
.board{position:relative;border:2.5px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);box-shadow:5px 6px 0 var(--shadow)}
canvas{display:block;width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;
  background:color-mix(in srgb,var(--paper) 82%,transparent)}
.overlay[hidden]{display:none}
.overlay h3{margin:0;font-size:clamp(1.3rem,4.5vw,1.9rem);letter-spacing:-.01em;max-width:24ch;text-wrap:balance}
.overlay p{margin:0;color:var(--ink2);max-width:34ch}
.go{border:2.5px solid var(--line);background:var(--masala);color:#fff8ee;border-radius:14px;padding:10px 20px;font-weight:800;font-size:1.05rem;box-shadow:3px 4px 0 var(--shadow)}
.go:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--shadow)}
.hint{color:var(--ink2);font-size:.9rem;margin:10px 2px 0}
/* Bill Bachao */
.deck{position:relative;height:340px;display:grid;place-items:center;overflow:hidden;background:
  repeating-linear-gradient(-45deg,transparent 0 14px,color-mix(in srgb,var(--paper2) 60%,transparent) 14px 15px)}
.habit{position:absolute;width:min(300px,82%);min-height:230px;border:2.5px solid var(--line);border-radius:20px;background:var(--card);
  box-shadow:4px 5px 0 var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;touch-action:none;cursor:grab;will-change:transform}
.habit .tag{align-self:flex-start;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--line);border-radius:999px;padding:2px 8px}
.habit p{margin:0;font-size:1.25rem;font-weight:700;line-height:1.3}
.habit svg{margin-top:auto;align-self:center}
.stamp{position:absolute;top:18px;font-weight:900;font-size:1.3rem;border:3px solid;border-radius:10px;padding:2px 10px;opacity:0;letter-spacing:.04em}
.stamp.l{left:14px;color:var(--masala);transform:rotate(-12deg)}
.stamp.r{right:14px;color:var(--leaf);transform:rotate(12deg)}
.choices{display:flex;gap:10px;justify-content:center;padding:12px;border-top:2.5px solid var(--line)}
.choice{flex:1;max-width:200px;border:2.5px solid var(--line);border-radius:14px;padding:10px;font-weight:800;background:var(--card);box-shadow:3px 4px 0 var(--shadow)}
.choice.bad{color:var(--masala)}.choice.good{color:var(--leaf)}
.choice:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--shadow)}
.meter{height:14px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper2);flex:1;min-width:120px;max-width:260px}
.meter i{display:block;height:100%;background:var(--masala);transition:width .35s ease}
.why{min-height:3em;margin:10px 4px 0;font-weight:600;color:var(--ink2)}
/* Chimney Chill */
.gridwrap{padding:14px;display:grid;place-items:center}
#tiles{width:min(100%,460px);height:auto;touch-action:manipulation}
#tiles .t{cursor:pointer}
#tiles .t:focus-visible rect{stroke:var(--masala);stroke-width:4}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 12px 14px}
.city{margin:4px 0 22px;border:2.5px solid var(--line);border-radius:20px;background:var(--card);box-shadow:5px 6px 0 var(--shadow);overflow:hidden}
.city svg{display:block;width:100%;height:auto}
.cityrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-top:2.5px solid var(--line)}
.cityrow b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.cityrow .next{color:var(--ink2);font-size:.92rem;margin-right:auto}
.prog{height:10px;flex-basis:100%;border:2px solid var(--line);border-radius:999px;background:var(--paper2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf);transition:width .6s ease}
.streak{display:flex;gap:4px;align-items:center;font-weight:700;font-size:.9rem}
.streak svg{width:22px;height:22px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,15,10,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.sheet{width:min(560px,100%);max-height:88svh;overflow:auto;background:var(--paper);border:2.5px solid var(--line);border-radius:20px;padding:6px 16px 18px;box-shadow:6px 8px 0 var(--shadow)}
.stampgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.stamp-c{text-align:center;font-size:.82rem;color:var(--ink2);min-width:0}
.stamp-c b{display:block;color:var(--ink);font-size:.9rem;margin-top:4px}
.stamp-c svg{width:86px;height:86px}
.stamp-c.off svg{opacity:.35;filter:grayscale(1)}
#toasts{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:grid;gap:8px;justify-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;box-shadow:4px 5px 0 var(--shadow);display:flex;gap:10px;align-items:center;animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
.toast svg{width:40px;height:40px;flex:none}
.toast small{display:block;font-weight:600;color:var(--ink2)}
@keyframes slam{0%{transform:scale(1.8) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.skins{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.skin{border:2.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 6px;background:var(--card);font-weight:700;font-size:.85rem;display:flex;gap:6px;align-items:center}
.skin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:block}
.skin[aria-pressed="true"]{outline:3px solid var(--masala);outline-offset:1px}
.skin[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.skin small{font-weight:600;font-size:.7rem;color:var(--ink2)}
.deck.fever{background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--haldi) 30%,transparent) 0 14px,transparent 14px 28px)}
.deck.fever .habit{border-color:var(--haldi);box-shadow:0 0 0 4px color-mix(in srgb,var(--haldi) 55%,transparent),4px 5px 0 var(--shadow)}
.meter.hurry i{background:repeating-linear-gradient(90deg,var(--masala) 0 8px,var(--haldi) 8px 16px)}
.levels{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 12px 12px}
.lv{border:2px solid var(--line);border-radius:10px;background:var(--card);padding:3px 8px;font-weight:800;font-size:.8rem;line-height:1.1}
.lv small{display:block;color:var(--haldi);letter-spacing:1px;font-size:.7rem}
.lv[aria-current="true"]{background:var(--ink);color:var(--paper)}
.shareSheet .sheet{max-width:440px}
#shareCv{display:block;width:100%;height:auto;border:2.5px solid var(--line);border-radius:16px;box-shadow:5px 6px 0 var(--shadow);background:var(--paper)}
.shareRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.shareBtn{border:2.5px solid var(--line);border-radius:14px;background:var(--card);padding:8px 4px;font-weight:800;font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);text-decoration:none;box-shadow:3px 3px 0 var(--shadow)}
.shareBtn svg{width:26px;height:26px}
.shareBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.shareMain{width:100%;margin-top:12px}
.brag{display:block;margin-top:8px}
.vs{display:none;margin:14px 0 4px;border:2.5px solid var(--line);border-radius:16px;background:var(--haldi);color:#2a2018;padding:10px 14px;font-weight:800;box-shadow:4px 4px 0 var(--shadow);transform:rotate(-.6deg)}
.vs.on{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vs button{margin-left:auto}
.foot{margin-top:28px;color:var(--ink2);font-size:.92rem;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.foot a{color:var(--ink);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-view="home">
<div class="wrap">
  <header class="top">
    <a class="brand" href="/" data-online-only>
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M6 12h15v8a6 6 0 0 1-6 6h-3a6 6 0 0 1-6-6z" fill="var(--haldi)" stroke="var(--line)" stroke-width="2.2"/><path d="M21 14h2.5a3 3 0 0 1 0 6H21" fill="none" stroke="var(--line)" stroke-width="2.2"/><g class="steam"><path d="M10 9c-1-2 1-3 0-5" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linecap="round"/><path d="M14.5 9c-1-2 1-3 0-5" fill="none" stroke="var(--line)" stroke-width="1.8" stroke-linecap="round"/></g></svg>
      <span>Senseible</span>
    </a>
    <div class="langs" role="group" aria-label="Language">
      <button class="pill" data-lang="hx">Hinglish</button>
      <button class="pill" data-lang="en">English</button>
      <button class="pill" data-lang="hi">हिंदी</button>
    </div>
    <button class="pill" id="snd" aria-pressed="true" data-t="sound"></button>
  </header>
  <p class="offline" data-t="offline"></p>

  <section id="home">
    <div class="vs" id="vs" role="status"><span id="vsText"></span><button class="go" id="vsGo"></button></div>
    <span class="sticker" data-t="sticker"></span>
    <h1 data-t="title" data-html></h1>
    <p class="lede" data-t="lede"></p>
    <section class="city" aria-labelledby="city-h">
      <h2 id="city-h" class="sr" data-t="city_title"></h2>
      <svg id="city" viewBox="0 0 600 190" role="img"></svg>
      <div class="cityrow">
        <b id="hawa"></b><span class="next" id="cnext"></span>
        <span class="streak" id="streak"></span>
        <button class="pill" id="stampsBtn"></button>
        <div class="prog" aria-hidden="true"><i id="cprog"></i></div>
      </div>
    </section>
    <div class="shelf">
      <button class="ticket" data-open="runner">
        <svg viewBox="0 0 240 110" aria-hidden="true">
          <path d="M0 92 Q60 86 120 92 T240 90" fill="none" stroke="var(--line)" stroke-width="2.5"/>
          <g fill="var(--smog)" stroke="var(--line)" stroke-width="2"><circle cx="190" cy="40" r="14"/><circle cx="206" cy="34" r="11"/><circle cx="214" cy="48" r="10"/></g>
          <circle cx="150" cy="22" r="10" fill="var(--haldi)" stroke="var(--line)" stroke-width="2"/>
          <g stroke="var(--line)" stroke-width="2.4" stroke-linejoin="round"><path d="M38 58 h48 l14 14 v12 H34 v-20z" fill="var(--leaf)"/><path d="M40 58 q20-16 46 0" fill="var(--haldi)"/></g>
          <g fill="var(--card)" stroke="var(--line)" stroke-width="2.4"><circle cx="46" cy="86" r="8"/><circle cx="92" cy="86" r="8"/></g>
        </svg>
        <b data-t="g1"></b><span data-t="g1s"></span><span class="best" data-best="runner"></span>
      </button>
      <button class="ticket" data-open="swipe">
        <svg viewBox="0 0 240 110" aria-hidden="true">
          <rect x="70" y="14" width="80" height="86" rx="10" fill="var(--paper2)" stroke="var(--line)" stroke-width="2.4" transform="rotate(-10 110 57)"/>
          <rect x="84" y="10" width="80" height="86" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2.4" transform="rotate(7 124 53)"/>
          <path d="M112 40l-6 16h10l-6 16" fill="none" stroke="var(--masala)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="rotate(7 124 53)"/>
          <path d="M30 55h26M38 47l-8 8 8 8" fill="none" stroke="var(--masala)" stroke-width="3" stroke-linecap="round"/>
          <path d="M184 55h26M202 47l8 8-8 8" fill="none" stroke="var(--leaf)" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <b data-t="g2"></b><span data-t="g2s"></span><span class="best" data-best="swipe"></span>
      </button>
      <button class="ticket" data-open="grid">
        <svg viewBox="0 0 240 110" aria-hidden="true">
          <g stroke="var(--line)" stroke-width="2.4"><rect x="20" y="40" width="40" height="28" fill="var(--sky)"/><path d="M20 54h40M33 40v28M46 40v28" /></g>
          <path d="M60 54 H110 V80 H160 V54 H180" fill="none" stroke="var(--haldi)" stroke-width="6" stroke-linecap="round"/>
          <path d="M60 54 H110 V80 H160 V54 H180" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="4 5"/>
          <g stroke="var(--line)" stroke-width="2.4" stroke-linejoin="round"><path d="M180 92V58l14 8v-8l14 8V34h12v58z" fill="var(--paper2)"/></g>
          <path d="M214 28c-4-6 4-8 0-14" fill="none" stroke="var(--leaf)" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <b data-t="g3"></b><span data-t="g3s"></span><span class="best" data-best="grid"></span>
      </button>
    </div>
  </section>

  <!-- 1. Dhuaan Dhoom: one-tap runner -->
  <section id="runner" class="stage" aria-labelledby="r-h">
    <div class="bar"><button class="back" data-back data-t="back"></button><h2 id="r-h" data-t="g1"></h2><span class="hud" id="r-hud"></span></div>
    <div class="board">
      <canvas id="r-cv" width="800" height="320" aria-label="Dhuaan Dhoom" role="img"></canvas>
      <div class="overlay" id="r-ov"><h3 id="r-msg"></h3><p id="r-sub"></p><div class="skins" id="r-skins" role="group"></div><button class="go" id="r-go"></button><button class="pill brag" id="r-share" hidden data-t="share_btn"></button></div>
    </div>
    <p class="hint" data-t="g1h"></p>
  </section>

  <!-- 2. Bill Bachao: swipe habits -->
  <section id="swipe" class="stage" aria-labelledby="s-h">
    <div class="bar"><button class="back" data-back data-t="back"></button><h2 id="s-h" data-t="g2"></h2>
      <div class="meter" aria-hidden="true"><i id="s-time" style="width:100%"></i></div><span class="hud" id="s-hud"></span></div>
    <div class="board">
      <div class="deck" id="s-deck"></div>
      <div class="choices"><button class="choice bad" id="s-bad"></button><button class="choice good" id="s-good"></button></div>
      <div class="overlay" id="s-ov"><h3 id="s-msg"></h3><p id="s-sub"></p><button class="go" id="s-go"></button><button class="pill brag" id="s-share" hidden data-t="share_btn"></button></div>
    </div>
    <p class="why" id="s-why" aria-live="polite"></p>
  </section>

  <!-- 3. Chimney Chill: rotate the wires -->
  <section id="grid" class="stage" aria-labelledby="c-h">
    <div class="bar"><button class="back" data-back data-t="back"></button><h2 id="c-h" data-t="g3"></h2><span class="hud" id="c-hud"></span></div>
    <div class="board">
      <div class="gridwrap"><svg id="tiles" role="group" aria-label="Chimney Chill"></svg></div>
      <div class="row"><button class="pill" id="c-daily" data-t="daily"></button><button class="pill" id="c-next" data-t="next"></button></div>
      <div class="levels" id="c-levels" role="group"></div>
      <div class="overlay" id="c-ov" hidden><h3 id="c-msg"></h3><p id="c-sub"></p><button class="go" id="c-go"></button><button class="pill brag" id="c-share" hidden data-t="share_btn"></button></div>
    </div>
    <p class="hint" data-t="g3h"></p>
  </section>

  <div class="modal" id="stampModal" hidden role="dialog" aria-modal="true" aria-labelledby="stTitle">

let sound = store.get('sound', true), ac = null;
function beep(f = 440, d = 0.08, type = 'square', vol = 0.05, slide = 0) {
  if (!sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; if (slide) o.frequency.linearRampToValueAtTime(f + slide, ac.currentTime + d);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch { /* no audio */ }
}

// ---------- progress: one city, one streak, one stamp book ----------
// Everything is kept in this browser only. Points from any game clean the
// same city; thresholds add things a cleaner city has.
const Meta = (() => {
  const CITY = [60, 160, 320, 520, 800, 1200];
  const STAMP_IDS = ['first', 'slayer', 'suns', 'close', 'shield', 'baba', 'fever', 'wire', 'daily', 'streak', 'all', 'city'];
  const get = () => Object.assign({ hawa: 0, days: [], stamps: {}, played: {}, skin: 0 }, store.get('meta', {}));
  const put = (m) => store.set('meta', m);
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  function streak(m = get()) {
    const set = new Set(m.days); let n = 0; const d = new Date();
    if (!set.has(dayKey(d))) d.setDate(d.getDate() - 1);
    while (set.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function stamp(id) {
    const m = get(); if (m.stamps[id]) return false;
    m.stamps[id] = dayKey(); put(m);
    const row = t('stamps').find((x) => x[0] === id);
    toast(stampSvg(id, true), t('stamp_new'), row ? row[1] : id);
    [660, 880, 1320].forEach((f, k) => setTimeout(() => beep(f, 0.1, 'triangle', 0.05), k * 80));
    return true;
  }
  function finish(game, pts) {
    const m = get(), before = m.hawa;
    m.hawa += Math.max(0, Math.round(pts)); m.played[game] = true;
    const today = dayKey(); if (!m.days.includes(today)) m.days = [...m.days, today].slice(-60);
    put(m);
    if (pts > 0) toast(kulhad(true), t('earned')(Math.round(pts)), t('hawa')(m.hawa));
    CITY.forEach((th, i) => { if (before < th && m.hawa >= th) setTimeout(() => toast(citySpark(), t('unlock_toast')(t('unlocks')[i]), ''), 700); });
    stamp('first');
    if (['runner', 'swipe', 'grid'].every((g) => m.played[g])) stamp('all');
    if (streak(m) >= 3) stamp('streak');
    if (m.hawa >= CITY[CITY.length - 1]) stamp('city');
    home();
  }
  function toast(svg, title, sub) {

  const rot = (m) => ((m << 1) | (m >> 3)) & 15;
  function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
  function build(seed, size) {
    const r = rng(seed); n = size;
    src = Math.floor(r() * n); dst = Math.floor(r() * n);

  function needTurns(cur, want) { let m = cur; for (let q = 0; q < 4; q++) { if (m === want) return q; m = rot(m); } return 0; }

    el('circle', { cx: 24, cy: sy - 30, r: 7, fill: css('--haldi'), stroke: ink, 'stroke-width': 2 }, sp);
    const fx = pad + n * S + 4, fg = el('g', {}, svg);
    el('line', { x1: pad + n * S - 2, y1: fy, x2: fx + 2, y2: fy, stroke: ok ? css('--haldi') : css('--smog'), 'stroke-width': 7, 'stroke-linecap': 'round' }, fg);
    el('path', { d: `M${fx} ${fy + 22}V${fy - 2}l12 7v-7l12 7V${fy - 26}h10v48z`, fill: ok ? css('--paper2') : css('--paper2'), stroke: ink, 'stroke-width': 2.4, 'stroke-linejoin': 'round' }, fg);
    if (!ok) { [0, 1].forEach((k) => el('circle', { cx: fx + 39 + k * 5, cy: fy - 34 - k * 10, r: 5 + k * 2, fill: css('--smog'), stroke: ink, 'stroke-width': 1.8 }, fg)); }
    else { el('path', { d: `M${fx + 39} ${fy - 30}c-4-6 4-8 0-14`, fill: 'none', stroke: css('--leaf'), 'stroke-width': 2.6, 'stroke-linecap': 'round' }, fg);
      el('path', { d: `M${fx + 10} ${fy - 44}q4-4 8 0q4-4 8 0`, fill: 'none', stroke: ink, 'stroke-width': 1.8, 'stroke-linecap': 'round' }, fg); }
    cells.forEach((row, y) => row.forEach((c, x) => {
      const g = el('g', { class: 't', tabindex: 0, role: 'button', 'aria-label': `Tile ${y + 1}, ${x + 1}`, transform: `translate(${pad + x * S},${10 + y * S})` }, svg);
      el('rect', { x: 2, y: 2, width: S - 4, height: S - 4, rx: 10, fill: c.on ? 'color-mix(in srgb, var(--haldi) 22%, var(--card))' : css('--card'), stroke: ink, 'stroke-width': 2 }, g);
      const inner = el('g', { transform: `translate(${S / 2},${S / 2})` }, g);
      const ends = [[1, 0, -S / 2 + 2], [2, S / 2 - 2, 0], [4, 0, S / 2 - 2], [8, -S / 2 + 2, 0]];

        el('line', { x1: 0, y1: 0, x2: ex, y2: ey, stroke: c.on ? css('--haldi') : css('--smog'), 'stroke-width': 9, 'stroke-linecap': 'round' }, inner);
        el('line', { x1: 0, y1: 0, x2: ex, y2: ey, stroke: ink, 'stroke-width': 1.4, 'stroke-dasharray': c.on ? '3 5' : '0', 'stroke-linecap': 'round' }, inner);
      }
      el('circle', { cx: 0, cy: 0, r: 6, fill: c.on ? css('--haldi') : css('--card'), stroke: ink, 'stroke-width': 2 }, inner);

  function win() {

      text: beat ? t('sh_beat')(`L${Share.vs.val}`, `L${level}`) : t('sh_grid')(lv, starTxt, moves), url: Share.link('grid', daily ? 1 : level), foot: t('sticker') });

// ---------- shell ----------
const views = { runner: Runner, swipe: Swipe, grid: Grid };
