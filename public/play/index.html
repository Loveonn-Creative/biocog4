<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chai Break Arcade | Senseible</title>
<meta name="description" content="Three tiny games about clean air and smaller bills. Tap and play, online or offline.">
<meta name="theme-color" content="#f3e9d8">
<link rel="icon" href="/favicon.png">
<link rel="canonical" href="https://senseible.earth/play/">
<!--
  Chai Break Arcade. One self-contained file: no libraries, no fonts to fetch,
  no AI, no uploads, nothing sent anywhere. The service worker (/sw.js) keeps
  this file so it also opens when the visitor has no internet.
  Facts used in the copy (kept here, not on screen):
  - India grid: 0.710 kg CO2 per kWh (supabase/functions/_shared/emissionFactors.ts).
  - Each 1 C higher on an AC saves about 6% electricity (Bureau of Energy
    Efficiency / Ministry of Power advisory, June 2018).
  - ENERGY STAR LEDs use at least 75% less energy than incandescent bulbs (US DOE,
    energy.gov "LED Lighting"); the copy says "about 75%" and compares with filament bulbs only.
  - Compressed-air leaks can waste 20-30% of a compressor's output (US DOE,
    "Improving Compressed Air System Performance" sourcebook).
-->
<style>
:root{
  --paper:#f3e9d8;--paper2:#eadcc4;--ink:#2a2018;--ink2:#5b4b3c;--masala:#d9572a;--haldi:#e9a92a;
  --leaf:#2f7a4c;--sky:#9fd0e2;--smog:#8b857a;--card:#fffaf0;--line:#2a2018;--shadow:rgba(42,32,24,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#1d1914;--paper2:#2a241c;--ink:#f3e9d8;--ink2:#c9b9a2;--masala:#f07a4a;--haldi:#f2bd4a;
  --leaf:#5bb27c;--sky:#2c5566;--smog:#4d4840;--card:#27211a;--line:#f3e9d8;--shadow:rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:16px/1.45 ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Devanagari",sans-serif;
  min-height:100svh;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));
  background-image:radial-gradient(var(--paper2) 1px,transparent 1.2px);background-size:22px 22px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding-block:16px 40px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.02em;text-decoration:none;color:var(--ink);margin-right:auto;display:flex;align-items:center;gap:8px}
.pill{border:2px solid var(--line);border-radius:999px;background:var(--card);padding:6px 12px;font-size:14px;font-weight:700}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.langs{display:flex;gap:4px}
@media (max-width:440px){.pill{padding:5px 9px;font-size:13px}.brand span{display:none}}
.sticker{display:inline-block;transform:rotate(-3deg);background:var(--haldi);color:#2a2018;border:2.5px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:800;font-size:.9rem;box-shadow:3px 3px 0 var(--shadow);margin-top:14px}
.steam path{animation:rise 2.6s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.8s}
@keyframes rise{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-8px);opacity:0}}
.offline{display:none;margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-weight:600}
body.is-offline .offline{display:block}
h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.02;margin:22px 0 8px;letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal;color:var(--masala)}
.lede{color:var(--ink2);max-width:34ch;margin:0 0 20px;font-size:1.05rem}
.shelf{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.ticket{position:relative;text-align:left;border:2.5px solid var(--line);border-radius:18px;background:var(--card);padding:14px 14px 16px;
  box-shadow:5px 6px 0 var(--shadow);transition:transform .15s ease,box-shadow .15s ease;min-width:0}
.ticket:hover,.ticket:focus-visible{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:8px 10px 0 var(--shadow);outline:none}
.ticket:nth-child(2):hover{transform:translate(-2px,-3px) rotate(.6deg)}
.ticket svg{width:100%;height:auto;display:block;margin-bottom:8px}
.ticket b{display:block;font-size:1.3rem;letter-spacing:-.01em}
.ticket span{display:block;color:var(--ink2);font-size:.95rem}
.ticket .best{margin-top:8px;font-size:.8rem;font-weight:700;color:var(--masala);letter-spacing:.04em;text-transform:uppercase}
.stage{display:none}
body[data-view="runner"] #runner,body[data-view="swipe"] #swipe,body[data-view="grid"] #grid{display:block}
body:not([data-view="home"]) #home{display:none}
.bar{display:flex;align-items:center;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.bar h2{margin:0 auto 0 0;font-size:1.5rem;letter-spacing:-.01em}
.back{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:700}
.hud{font-weight:800;font-variant-numeric:tabular-nums}
.board{position:relative;border:2.5px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);box-shadow:5px 6px 0 var(--shadow)}
canvas{display:block;width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;
  background:color-mix(in srgb,var(--paper) 82%,transparent)}
.overlay[hidden]{display:none}
.overlay h3{margin:0;font-size:clamp(1.3rem,4.5vw,1.9rem);letter-spacing:-.01em;max-width:24ch;text-wrap:balance}
.overlay p{margin:0;color:var(--ink2);max-width:34ch}
.go{border:2.5px solid var(--line);background:var(--masala);color:#fff8ee;border-radius:14px;padding:10px 20px;font-weight:800;font-size:1.05rem;box-shadow:3px 4px 0 var(--shadow)}
.go:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--shadow)}
.hint{color:var(--ink2);font-size:.9rem;margin:10px 2px 0}
/* Bill Bachao */
.deck{position:relative;height:340px;display:grid;place-items:center;overflow:hidden;background:
  repeating-linear-gradient(-45deg,transparent 0 14px,color-mix(in srgb,var(--paper2) 60%,transparent) 14px 15px)}
.habit{position:absolute;width:min(300px,82%);min-height:230px;border:2.5px solid var(--line);border-radius:20px;background:var(--card);
  box-shadow:4px 5px 0 var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;touch-action:none;cursor:grab;will-change:transform}
.habit .tag{align-self:flex-start;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--line);border-radius:999px;padding:2px 8px}
.habit p{margin:0;font-size:1.25rem;font-weight:700;line-height:1.3}
.habit svg{margin-top:auto;align-self:center}
.stamp{position:absolute;top:18px;font-weight:900;font-size:1.3rem;border:3px solid;border-radius:10px;padding:2px 10px;opacity:0;letter-spacing:.04em}
.stamp.l{left:14px;color:var(--masala);transform:rotate(-12deg)}
.stamp.r{right:14px;color:var(--leaf);transform:rotate(12deg)}
.choices{display:flex;gap:10px;justify-content:center;padding:12px;border-top:2.5px solid var(--line)}
.choice{flex:1;max-width:200px;border:2.5px solid var(--line);border-radius:14px;padding:10px;font-weight:800;background:var(--card);box-shadow:3px 4px 0 var(--shadow)}
.choice.bad{color:var(--masala)}.choice.good{color:var(--leaf)}
.choice:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--shadow)}
.meter{height:14px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper2);flex:1;min-width:120px;max-width:260px}
.meter i{display:block;height:100%;background:var(--masala);transition:width .35s ease}
.why{min-height:3em;margin:10px 4px 0;font-weight:600;color:var(--ink2)}
/* Chimney Chill */
.gridwrap{padding:14px;display:grid;place-items:center}
#tiles{width:min(100%,460px);height:auto;touch-action:manipulation}
#tiles .t{cursor:pointer}
#tiles .t:focus-visible rect{stroke:var(--masala);stroke-width:4}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 12px 14px}
.foot{margin-top:28px;color:var(--ink2);font-size:.92rem;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.foot a{color:var(--ink);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = { get(k, d) { try { const v = localStorage.getItem('cba:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('cba:' + k, JSON.stringify(v)); } catch { /* private mode */ } } };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const t = (k) => T[lang][k] ?? T.hx[k];

// Tiny synth so nothing is downloaded.
let sound = store.get('sound', true), ac = null;
function beep(f = 440, d = 0.08, type = 'square', vol = 0.05, slide = 0) {
  if (!sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; if (slide) o.frequency.linearRampToValueAtTime(f + slide, ac.currentTime + d);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch { /* no audio */ }
}

function saveBest(k, v) { const b = store.get('best', {}); if (!b[k] || v > b[k]) { b[k] = v; store.set('best', b); return true; } return false; }

const Runner = (() => {

  let st = 'idle', raf = 0, last = 0, speed, dist, suns, smog, py, vy, holding, holdT, obs, items, spawnIn, puffs, cause, shake, wheel, hills;
  function reset() {
    speed = reduce ? 260 : 320; dist = 0; suns = 0; smog = 20; py = GROUND; vy = 0; holding = false; holdT = 0;
    obs = []; items = []; spawnIn = 1.1; puffs = []; cause = null; shake = 0; wheel = 0; pops = []; nextMile = 250; fit();
    hills = Array.from({ length: 6 }, (_, i) => ({ x: i * 180, h: 30 + (i * 37) % 50 }));
  }
  function jump() { if (st !== 'run') return start(); if (py >= GROUND - 0.5) { vy = -560; holding = true; holdT = 0; beep(520, 0.09, 'square', 0.04, 260); } }
  function release() { holding = false; }
  function spawn() {
    const r = Math.random(), x = W + 40;
    if (r < 0.38) obs.push({ k: 'genset', x, w: 46, h: 38, y: GROUND - 38 });
    else if (r < 0.6) obs.push({ k: 'tyre', x, w: 70, h: 26, y: GROUND - 26 });
    else if (r < 0.82 && dist > 120) obs.push({ k: 'cloud', x, w: 90, h: 46, y: GROUND - 175 });
    else obs.push({ k: 'genset', x, w: 46, h: 38, y: GROUND - 38 });
    if (Math.random() < 0.55) items.push({ x: x + 120 + Math.random() * 120, y: GROUND - 70 - Math.random() * 90, r: 13, got: false, t: 0 });

  }
  function hit(o) {
    const px = 120, w = 62, h = 40, top = py - h;

  }
  function over(c) {

    $('#r-msg').textContent = rec && m > 0 ? t('r_best') : pick(t('r_' + c));

    obs = obs.filter((o) => o.x + o.w > -20);
    for (const s of items) {
      s.x -= speed * dt; s.t += dt;
      if (!s.got && Math.abs(s.x - 150) < 40 && Math.abs(s.y - (py - 22)) < 40) { s.got = true; suns++; smog = Math.max(0, smog - 16); beep(880, 0.07, 'triangle', 0.05, 440); pops.push({ x: s.x, y: s.y - 10, a: 1, txt: pick(t('r_pop')) }); }
    }
    items = items.filter((s) => s.x > -30 && !s.got);
    if (py >= GROUND && Math.random() < dt * 9) puffs.push({ x: 104, y: GROUND - 10, r: 4, a: 0.5 });
    for (const p of puffs) { p.x -= speed * dt * 0.6; p.r += dt * 14; p.a -= dt * 0.8; }
    puffs = puffs.filter((p) => p.a > 0);

    for (const q of pops) { q.y -= dt * 40; q.a -= dt * 0.9; }
    pops = pops.filter((q) => q.a > 0);
    if (dist >= nextMile) { pops.push({ x: W / 2, y: 90, a: 1.4, big: true, txt: t('r_mile')(nextMile) }); nextMile += 250; beep(988, 0.12, 'triangle', 0.05); }
    if (smog >= 100) over('smog');
  }
  const mix = (a, b, k) => { const pa = a.match(/\w\w/g).map((x) => parseInt(x, 16)), pb = b.match(/\w\w/g).map((x) => parseInt(x, 16));
